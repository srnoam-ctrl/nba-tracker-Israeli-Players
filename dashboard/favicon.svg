<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#38BDF8" stroke-width="2"/>

  <!-- Israeli Flag White Stripes -->
  <rect x="10" y="8" width="44" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="10" y="53" width="44" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>

  <!-- Basketball Core -->
  <circle cx="32" cy="32" r="18" fill="url(#ball)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Basketball Seams -->
  <path d="M 14 32 Q 32 32 50 32" stroke="#431407" stroke-width="1.5" fill="none"/>
  <path d="M 32 14 Q 32 32 32 50" stroke="#431407" stroke-width="1.5" fill="none"/>
  <path d="M 19 20 Q 32 32 19 44" stroke="#431407" stroke-width="1.4" fill="none"/>
  <path d="M 45 20 Q 32 32 45 44" stroke="#431407" stroke-width="1.4" fill="none"/>

  <!-- Israeli Star Accent Badge (Magen David) -->
  <circle cx="45" cy="19" r="8" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="45" y="22.5" font-size="9" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-weight="900">✡</text>
</svg>
