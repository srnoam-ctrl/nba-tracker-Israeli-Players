name: NBA Israelis Tracker Auto-Refresh

on:
  schedule:
    # Runs during morning game finish times and throughout the day (UTC times: 03:00, 05:00, 06:00, 07:00, 08:00, 10:00, 14:00, 20:00)
    # Israel time (UTC+3): 06:00, 08:00, 09:00, 10:00, 11:00, 13:00, 17:00, 23:00
    - cron: '0 3,5,6,7,8,10,14,20 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NBA TV and Stats Tracker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python run_tracker.py

      - name: Commit and push updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/games_data.js data/pini_videos_cache.json
          if git diff --staged --quiet; then
            echo "No new updates in games data."
          else
            git commit -m "Auto-refresh: Updated NBA broadcast schedule and boxscores [skip ci]"
            git push
          fi
