name: NBA Israelis Tracker 48h Auto-Refresh

on:
  schedule:
    # Runs every 48 hours (every 2 days at 04:00 UTC = 07:00 Israel Time)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NBA TV and Stats Tracker
        run: |
          python run_tracker.py

      - name: Commit and push updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/games_data.js
          if git diff --staged --quiet; then
            echo "No new updates in games data."
          else
            git commit -m "Auto-refresh: Updated NBA broadcast schedule and boxscores [skip ci]"
            git push
          fi
